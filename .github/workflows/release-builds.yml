name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release_metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine artifact version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag v0.1.0 becomes 0.1.0; manual runs use the Cargo package version.
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
          else
            version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r 'first(.packages[] | select(.name == "jira-parser") | .version)')"
          fi

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Unable to determine the release artifact version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package_name }}
    needs: release_metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_name: jira-parser-windows-x86_64
            executable: jira-parser.exe
            archive_extension: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_name: jira-parser-linux-x86_64
            executable: jira-parser
            archive_extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            package_name: jira-parser-macos-aarch64
            executable: jira-parser
            archive_extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.executable }}"
          $archive = "${{ matrix.package_name }}-${{ needs.release_metadata.outputs.version }}.${{ matrix.archive_extension }}"
          Compress-Archive -Path "dist/${{ matrix.executable }}" -DestinationPath "dist/$archive"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          archive="${{ matrix.package_name }}-${{ needs.release_metadata.outputs.version }}.${{ matrix.archive_extension }}"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" "${{ matrix.executable }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}-${{ needs.release_metadata.outputs.version }}
          path: dist/${{ matrix.package_name }}-${{ needs.release_metadata.outputs.version }}.${{ matrix.archive_extension }}
          if-no-files-found: error
